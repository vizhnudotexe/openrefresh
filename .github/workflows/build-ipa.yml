name: Build IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  ARCHIVE_PATH: ${{ github.workspace }}/build/AutoRefresh.xcarchive
  IPA_DIR:      ${{ github.workspace }}/build/ipa

jobs:
  build:
    name: Build & Export IPA
    runs-on: macos-15

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Select Xcode ──────────────────────────────────────────────────────
      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          xcodebuild -version

      # ── 3. Install xcpretty ──────────────────────────────────────────────────
      - name: Install xcpretty
        run: gem install xcpretty --no-document

      # ── 4. Archive ───────────────────────────────────────────────────────────
      # pipefail ensures xcpretty pipe doesn't hide xcodebuild failures.
      # Workspace path used for archive so all steps share the same location.
      - name: Archive
        run: |
          set -o pipefail
          mkdir -p "${{ github.workspace }}/build"
          xcodebuild archive \
            -project AutoRefresh/AutoRefresh.xcodeproj \
            -scheme AutoRefresh \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${{ env.ARCHIVE_PATH }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            | xcpretty

      # ── 5. Verify archive exists ─────────────────────────────────────────────
      - name: Verify archive & list contents
        run: |
          echo "=== Archive root ==="
          ls -la "${{ env.ARCHIVE_PATH }}" || { echo "ARCHIVE NOT FOUND"; exit 1; }
          echo ""
          echo "=== Full tree (depth 6) ==="
          find "${{ env.ARCHIVE_PATH }}" -maxdepth 6 | sort

      # ── 6. Package .ipa ──────────────────────────────────────────────────────
      - name: Package IPA (unsigned)
        run: |
          ARCHIVE="${{ env.ARCHIVE_PATH }}"
          IPA_DIR="${{ env.IPA_DIR }}"

          # Locate .app wherever Xcode put it inside the archive
          APP_PATH=$(find "$ARCHIVE" -name "*.app" -maxdepth 8 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in archive"
            exit 1
          fi
          echo "App bundle: $APP_PATH"

          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"

          cd "$IPA_DIR"
          zip -r AutoRefresh.ipa Payload/
          echo "IPA: $(du -sh AutoRefresh.ipa | cut -f1)"
          ls -lh AutoRefresh.ipa

      # ── 7. Upload artifact ───────────────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoRefresh-unsigned
          path: ${{ env.IPA_DIR }}/AutoRefresh.ipa
          retention-days: 30

      # ── 8. Create GitHub Release ─────────────────────────────────────────────
      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "AutoRefresh v1.0 (build ${{ github.run_number }})"
          body: |
            ## AutoRefresh IPA — unsigned build ${{ github.run_number }}

            ### Install via SideStore
            1. Download `AutoRefresh.ipa` from **Assets** below
            2. SideStore → **+** → select the `.ipa` → Install
            3. Open AutoRefresh once → allow notifications
            4. Build the shortcut per [`SHORTCUT_BUILD_GUIDE.md`](https://github.com/vizhnudotexe/openrefresh/blob/main/AutoRefresh/SHORTCUT_BUILD_GUIDE.md)

            Commit: `${{ github.sha }}`
          files: ${{ env.IPA_DIR }}/AutoRefresh.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
